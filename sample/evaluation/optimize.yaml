# sample/ から実行: azd ai agent optimize --config evaluation/optimize.yaml
# 送信前に、最新のデプロイ済みエージェントをローカルのベースラインに揃える。
#
# 「この判断日に誰が承認するか」のシナリオ。暗記ではなく一般的な手順で成功する設計:
# - 学習と検証では、部門・人名・日付が異なる（evaluation/generate_approver_data.py で生成）。
#   学習の質問からコピーした人名や日付は、検証の質問には役立たない。
# - ベースラインに必要な改善は行動: Work IQ で従業員の直属上司を調べ、判断日の休暇と
#   記録済み委任を確認し、非公式な近道を無視して、最初に回答を示す。
# - 各行に固有の事実を含まない評価基準を付ける。参照回答は名簿から計算する。
# 実行後、採用候補を evaluation/check_prompt_facts.py で確認してから昇格する。
name: purchasing-approver-optimisation
agent:
  name: purchasing-advice-demo
  kind: hosted
  model: gpt-5.4-mini
  config: ../agent/.agent_configs/baseline/metadata.yaml
# azd はデータセットのパスをサービスのプロジェクトディレクトリ sample/agent/ から解決する。
dataset:
  local_uri: ../evaluation/datasets/approvers-development.jsonl
validation_dataset:
  local_uri: ../evaluation/datasets/approvers-holdout.jsonl
evaluators:
  - name: purchasing-next-action
    initialization_parameters:
      deployment_name: gpt-5.5
      threshold: 1
  - name: purchasing-demo-rubric
    initialization_parameters:
      model: gpt-5.5
options:
  eval_model: gpt-5.5
  optimization_model: gpt-5.5
  # 改善した変更をさらに発展させるため、候補数を以前より増やす。各候補は約10〜15分。
  max_candidates: 4
# エージェントのモデルを固定するため model_search_space は指定しない。
# ドリフトセット（approvers-drift.jsonl）は最適化に絶対に渡さない。

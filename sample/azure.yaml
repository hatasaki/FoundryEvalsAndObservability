# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: ai-genius-purchasing
requiredVersions:
  azd: ">=1.34.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.13"
    azure.ai.projects: ">=1.0.0-beta.8"
    azure.ai.connections: ">=1.0.0-beta.9"  # Foundry Connections: app-insights サービス
infra:
  provider: microsoft.foundry
# infra/main.bicep は生成された Foundry テンプレートと modules/monitoring.bicep。
# Application Insights、評価器のアクセス権、GitHub Actions の ID を追加する。
hooks:
  # main.bicep が必要とする GitHub リポジトリを一度だけ尋ね、GITHUB_REPOSITORY に保存する。
  preprovision:
    shell: sh
    interactive: true
    run: sh infra/preprovision.sh
  # gh にログイン済みなら、GitHub の demo 環境とその変数を作る。
  # 単独で再実行: azd hooks run postprovision
  postprovision:
    shell: sh
    run: sh infra/postprovision.sh
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 400
      - name: gpt-5.5
        model:
          format: OpenAI
          name: gpt-5.5
          version: "2026-04-24"
        sku:
          name: GlobalStandard
          capacity: 300  # 評価器は長いツールトレースを送る。100では CI でレート制限に達した
      - name: text-embedding-3-small
        model:
          format: OpenAI
          name: text-embedding-3-small
          version: "1"
        sku:
          name: GlobalStandard
          capacity: 50
  # infra/main.bicep が作る Application Insights へのプロジェクト接続。ホスティングのトレースに使う。
  # プロビジョニング後に azd が適用する（出力: appInsightsId、appInsightsConnectionString）。
  app-insights:
    host: azure.ai.connection
    uses:
      - ai-project
    category: AppInsights
    target: ${appInsightsId}
    authType: ApiKey
    credentials:
      key: ${appInsightsConnectionString}
    metadata:
      ApiType: Azure
      ResourceId: ${appInsightsId}
  purchasing-advice-demo:
    host: azure.ai.agent
    project: ./agent
    language: python
    kind: hosted
    name: purchasing-advice-demo
    description: ローカルのポリシー検索と最適化設定を備える MAF 購入助言エージェント。
    uses:
      - ai-project
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AGENT_NAME: purchasing-advice-demo
      OPTIMIZATION_LOCAL_DIR: .agent_configs
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    hooks:
      # エージェント自身の ID はデプロイ後に作られるため、その時点で埋め込みへのアクセス権を付ける。
      # インラインで指定し、空白を含むフォルダーパスを azd が引用符なしで sh に渡すのを避ける。
      postdeploy:
        shell: sh
        run: sh ../infra/grant-agent-embeddings.sh

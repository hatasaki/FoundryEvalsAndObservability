name: エージェントの PR ゲート

# jp への各 PR では、安い検査から実行する。
#   1. オフライン: lint、評価リクエスト、プロンプトの事実コピー検査（数秒、Azure 不要）。
#   2. 開発セットを PR の基点リビジョンのベースラインと比較。
# ドリフトはここで実行しない。抜き打ち試験となるよう、リリース用に保持する。
on:
  pull_request:
    branches: [jp]
    paths:
      - "sample/**"
      - ".github/workflows/agent-*.yml"
      - ".github/workflows/_agent-eval.yml"
  workflow_dispatch:
    inputs:
      write_baseline:
        description: この実行を開発セットのベースラインとして保存する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    name: 1. Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: sample
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          python-version: "3.13"
          working-directory: sample
      - name: 固定バージョンの依存関係をインストール
        run: |
          uv venv
          uv pip install --require-hashes -r agent/requirements.txt -r requirements-dev.txt
      - name: lint と整形を検査
        run: |
          .venv/bin/ruff check agent evaluation
          .venv/bin/ruff format --check agent evaluation
      - name: Azure を使わず評価リクエストを確認
        run: .venv/bin/python evaluation/evaluate.py --dry-run > /dev/null
      - name: プロンプト内の事実を検査
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/base-config
          for f in instructions.md tools.json; do
            git show "origin/${GITHUB_BASE_REF}:sample/agent/.agent_configs/baseline/$f" \
              > "/tmp/base-config/$f"
          done
          python3 evaluation/check_prompt_facts.py \
            --baseline /tmp/base-config \
            --candidate agent/.agent_configs/baseline \
            --data agent/data/*.json

  development:
    name: 2. Development set vs baseline
    needs: offline
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_agent-eval.yml
    permissions:
      contents: read
      id-token: write
    with:
      agent_name: ${{ format('purchasing-advice-demo-pr-{0}', github.event.pull_request.number || github.run_id) }}
      dataset: approvers-development
      # デモ用。34件の二値判定で、ベースラインから3件の低下を許容する。
      tolerance: 0.10
      detail: full
      write_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.write_baseline }}

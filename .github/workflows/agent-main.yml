name: エージェントの昇格

on:
  push:
    branches: [jp]
    paths:
      - "sample/**"
      - ".github/workflows/agent-main.yml"
      - ".github/workflows/_agent-eval.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: 評価のみ、jp の昇格、または明示的なベースライン作成
        type: choice
        options:
          - holdout
          - release
          - baseline-holdout
          - baseline-drift
        default: holdout

permissions:
  contents: read
  pull-requests: read

# 2つの評価と承認の間は dev を固定する。新しい jp の候補は待機する。
concurrency:
  group: purchasing-promotion-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  target:
    name: ${{ github.ref == 'refs/heads/jp' && 'dev 実行を準備' || '確認用の実行を準備' }}
    runs-on: ubuntu-latest
    outputs:
      agent_name: ${{ steps.target.outputs.agent_name }}
      mode: ${{ steps.target.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 分離した対象を特定
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
        run: |
          case "$MODE" in
            holdout|release|baseline-holdout|baseline-drift) ;;
            *) echo "::error::不明な昇格モードです: $MODE"; exit 1 ;;
          esac
          if [ "$MODE" = "release" ] && [ "$GITHUB_REF" != "refs/heads/jp" ]; then
            echo "::error::昇格できるのは jp だけです。PR ブランチには holdout を使ってください。"
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/jp" ]; then
            agent="purchasing-advice-demo-dev"
          else
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
              --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then
              agent="purchasing-advice-demo-pr-$pr"
            else
              agent="purchasing-advice-demo-check-$GITHUB_RUN_ID"
            fi
          fi
          echo "agent_name=$agent" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "release" ] && [ ! -e sample/evaluation/baselines/approvers-drift.json ]; then
            echo "::error::ドリフトのベースラインがありません。mode=baseline-drift を実行し、成果物をコミットしてください（PLAYBOOK.md 参照）。"
            exit 1
          fi
          echo "モード: $MODE、エージェント: $agent、リビジョン: $GITHUB_SHA"

  holdout:
    name: ホールドアウトのゲート
    needs: target
    if: needs.target.outputs.mode != 'baseline-drift'
    uses: ./.github/workflows/_agent-eval.yml
    permissions:
      contents: read
      id-token: write
    with:
      agent_name: ${{ needs.target.outputs.agent_name }}
      dataset: approvers-holdout
      tolerance: 0.12
      detail: full
      write_baseline: ${{ needs.target.outputs.mode == 'baseline-holdout' }}

  drift:
    name: ドリフトのゲート
    needs: [target, holdout, approval]
    if: >-
      ${{ !cancelled() && (needs.target.outputs.mode == 'baseline-drift' ||
      (needs.target.outputs.mode == 'release' && needs.approval.result == 'success')) }}
    uses: ./.github/workflows/_agent-eval.yml
    permissions:
      contents: read
      id-token: write
    with:
      agent_name: ${{ needs.target.outputs.agent_name }}
      deploy_agent: ${{ needs.target.outputs.mode == 'baseline-drift' }}
      dataset: approvers-drift
      tolerance: 0.10
      min_passed: next_action_success=6
      max_unscored: 0
      detail: counts
      write_baseline: ${{ needs.target.outputs.mode == 'baseline-drift' }}

  approval:
    name: ドリフト前に dev をレビュー
    needs: [target, holdout]
    if: needs.target.outputs.mode == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 承認を記録
        run: echo "dev リビジョン $GITHUB_SHA のドリフト検査を承認しました。"

  release_approval:
    name: リリースを承認
    needs: [target, drift]
    if: needs.target.outputs.mode == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: リリース承認を記録
        run: echo "リビジョン $GITHUB_SHA のリリースを承認しました。"

  release:
    name: 承認済みリリースをデプロイ
    needs: [target, release_approval]
    if: needs.target.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 既存の Azure フェデレーションは demo を信頼する。production の2回のレビューはデプロイ前。
    environment: demo
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: sample
    env:
      AGENT_NAME: purchasing-advice-demo-release
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: "1.35.0"
      - name: 固定バージョンの Foundry 拡張機能をインストール
        run: |
          azd extension install azure.ai.agents --version 1.0.0-beta.13
          azd extension install azure.ai.projects --version 1.0.0-beta.8
          azd extension install azure.ai.connections --version 1.0.0-beta.9
      - name: 設定を確認
        run: |
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_ENV_NAME AZURE_LOCATION AZURE_AI_PROJECT_ID FOUNDRY_PROJECT_ENDPOINT; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::GitHub 変数がありません: $key"
              exit 1
            fi
          done
      - name: OIDC でログイン
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: 既存プロジェクトを設定
        run: |
          azd config set auth.useAzCliAuth true
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" --no-prompt
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_AI_PROJECT_ID "$AZURE_AI_PROJECT_ID"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set AGENT_NAME "$AGENT_NAME"
      - name: 承認済みリビジョンをデプロイ
        run: |
          # ネイティブな azd 検証の前に、このランナーのチェックアウトで両方の名前を解決する。
          yq -i '.services.purchasing-advice-demo.name = strenv(AGENT_NAME) |
            .services.purchasing-advice-demo.env.AGENT_NAME = strenv(AGENT_NAME)' azure.yaml
          azd deploy purchasing-advice-demo --no-prompt
          azd ai agent show purchasing-advice-demo --output json | python3 -c '
          import json, os, sys
          actual = json.load(sys.stdin)["name"]
          expected = os.environ["AGENT_NAME"]
          if actual != expected:
              raise SystemExit(f"エージェント名が不一致です: デプロイ済み {actual}、期待値 {expected}")
          print(f"確認したリリース対象: {actual}")
          '
          {
            echo "## リリース完了"
            echo "リビジョン: \`${GITHUB_SHA}\`"
            echo "エージェント: \`${AGENT_NAME}\`"
            echo "ホールドアウト合格、dev レビュー、ドリフト合格、リリース承認を完了しました。"
          } >> "$GITHUB_STEP_SUMMARY"
